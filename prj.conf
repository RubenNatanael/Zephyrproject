# ==============================================================================
# SYSTEM & CORE
# ==============================================================================
CONFIG_PRINTK=y
CONFIG_MAIN_STACK_SIZE=3072
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_INIT_STACKS=y

# ==============================================================================
# MEMORY & HEAP
# ==============================================================================
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_SYS_HEAP_RUNTIME_STATS=y

# ==============================================================================
# DEBUGGING & LOGGING
# ==============================================================================
CONFIG_SHELL=y
CONFIG_LOG=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

# ==============================================================================
# HARDWARE PERIPHERALS
# ==============================================================================
CONFIG_GPIO=y
CONFIG_LED=y
CONFIG_PWM=y
CONFIG_PWM_STM32=y

# Sensors
CONFIG_SENSOR=y
CONFIG_SENSOR_ASYNC_API=y
CONFIG_DHT=y

# ==============================================================================
# POSIX & SYSTEM APIs
# ==============================================================================
CONFIG_POSIX_API=y
CONFIG_ZVFS_POLL_MAX=32
CONFIG_EVENTFD=y

# ==============================================================================
# NETWORKING - CORE
# ==============================================================================
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_CONNECTION_MANAGER=y

# ==============================================================================
# NETWORKING - BUFFERS & RESOURCES
# ==============================================================================
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=128
CONFIG_NET_BUF_TX_COUNT=128
CONFIG_NET_CONTEXT_NET_PKT_POOL=y

# Contexts and connections
CONFIG_NET_IF_UNICAST_IPV6_ADDR_COUNT=3
CONFIG_NET_IF_MCAST_IPV6_ADDR_COUNT=4
CONFIG_NET_MAX_CONTEXTS=32
CONFIG_NET_MAX_CONN=32

# ==============================================================================
# NETWORKING - PROTOCOLS
# ==============================================================================
# HTTP Server
CONFIG_HTTP_PARSER=y
CONFIG_HTTP_PARSER_URL=y
CONFIG_HTTP_SERVER=y
CONFIG_HTTP_SERVER_MAX_CLIENTS=4

# WebSocket
CONFIG_HTTP_SERVER_WEBSOCKET=y
CONFIG_WEBSOCKET_MAX_CONTEXTS=4

# ==============================================================================
# NETWORKING - CONFIGURATION
# ==============================================================================
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_NEED_IPV6=y

# IPv4 Static Configuration
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.1.50"
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="192.168.1.50"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.1.1"

# IPv6 Static Configuration
CONFIG_NET_CONFIG_MY_IPV6_ADDR="2001:db8::1"
CONFIG_NET_CONFIG_PEER_IPV6_ADDR="2001:db8::2"

# ==============================================================================
# NETWORKING - OPTIMIZATION
# ==============================================================================
# Required to handle large number of consecutive connections (e.g., ApacheBench)
CONFIG_NET_TCP_TIME_WAIT_DELAY=0

# ==============================================================================
# NETWORKING - DEBUG & MONITORING
# ==============================================================================
CONFIG_NET_SHELL=y
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_USER_API=y
CONFIG_NET_LOG=y

# Debug log levels (set to 'n' to reduce verbosity)
CONFIG_NET_SOCKETS_LOG_LEVEL_DBG=n
CONFIG_NET_HTTP_LOG_LEVEL_DBG=n
CONFIG_NET_IPV6_LOG_LEVEL_DBG=n
CONFIG_NET_IPV6_ND_LOG_LEVEL_DBG=n

# ==============================================================================
# TIME & RTC
# ==============================================================================
CONFIG_RTC=y
CONFIG_SNTP=y

# ==============================================================================
# JSON LIBRARY
# ==============================================================================
CONFIG_JSON_LIBRARY=y

# ==============================================================================
# MISCELLANEOUS
# ==============================================================================
CONFIG_REBOOT=y
